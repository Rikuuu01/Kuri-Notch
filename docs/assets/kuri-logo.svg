<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181828"/>
      <stop offset="1" stop-color="#080811"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="128" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="126" height="126" rx="31" stroke="url(#cyanGlow)" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Notch Island Shape -->
  <rect x="18" y="32" width="92" height="30" rx="15" fill="#05050A" stroke="#2A2A3E" stroke-width="1.5"/>
  <!-- Notch Eyes / Mochi in Center -->
  <rect x="47" y="39" width="12" height="16" rx="5.5" fill="#E4D9FF" filter="url(#glow)"/>
  <rect x="69" y="39" width="12" height="16" rx="5.5" fill="#E4D9FF" filter="url(#glow)"/>
  <circle cx="51" cy="45" r="2.2" fill="#1E1E2A"/>
  <circle cx="73" cy="45" r="2.2" fill="#1E1E2A"/>
  <circle cx="53" cy="43.5" r="0.9" fill="#FFFFFF"/>
  <circle cx="75" cy="43.5" r="0.9" fill="#FFFFFF"/>
  <!-- Soundwave / Pulse underneath -->
  <path d="M30 84 C 42 84, 46 74, 64 74 C 82 74, 86 84, 98 84" stroke="url(#cyanGlow)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <circle cx="64" cy="98" r="3.5" fill="#38BDF8"/>
</svg>