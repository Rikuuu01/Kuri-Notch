<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b12" />
<title>Kuri</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b12;
    --card: #15151f;
    --card-2: #1b1b28;
    --stroke: #2a2a3a;
    --text: #e5e7eb;
    --muted: #8e8e9e;
    --accent: #38bdf8;
    --accent-2: #7dd3fc;
    --ok: #34d399;
    --bad: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(56, 189, 248, 0.12), transparent 60%),
      radial-gradient(100% 80% at 0% 100%, rgba(125, 211, 252, 0.07), transparent 55%),
      var(--bg);
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px rgba(52, 211, 153, 0.6); transition: background .2s, box-shadow .2s; }
  .dot.offline { background: var(--bad); box-shadow: 0 0 10px rgba(248, 113, 113, 0.5); }
  h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 16px; }
  .badge { font-size: 11.5px; color: var(--muted); border: 1px solid var(--stroke); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .card { background: var(--card); border: 1px solid var(--stroke); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  button {
    font: inherit; color: var(--text); border: 1px solid var(--stroke); background: var(--card-2);
    border-radius: 11px; padding: 11px 14px; cursor: pointer; transition: background .15s, border-color .15s, opacity .15s;
  }
  button:active { background: #242434; }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: linear-gradient(180deg, #1d8fc0, #176f96); border-color: #2aa2d8; color: #f0faff; font-weight: 600; }
  .primary:active { background: linear-gradient(180deg, #1a81ae, #145f81); }
  .row { display: flex; gap: 10px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  input[type="file"] { display: none; }
  .filelabel {
    display: block; text-align: center; border: 1px dashed #3a3a4e; border-radius: 12px;
    padding: 18px 12px; color: var(--accent-2); font-weight: 600; cursor: pointer; background: rgba(56,189,248,0.04);
  }
  .filelabel:active { background: rgba(56,189,248,0.09); }
  textarea {
    width: 100%; min-height: 88px; resize: vertical; background: #10101a; color: var(--text);
    border: 1px solid var(--stroke); border-radius: 11px; padding: 10px 12px; font: inherit; outline: none;
  }
  textarea:focus { border-color: #2f6f8c; }
  .progress { height: 6px; border-radius: 99px; background: #232332; overflow: hidden; margin-top: 10px; display: none; }
  .progress.on { display: block; }
  .progress > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .15s; }
  .status { font-size: 12.5px; margin-top: 8px; min-height: 17px; color: var(--muted); word-break: break-word; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #20202e; }
  li:last-child { border-bottom: 0; }
  .fname { flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fsize { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  a.dl { color: var(--accent-2); text-decoration: none; font-size: 12.5px; border: 1px solid #215067; border-radius: 9px; padding: 6px 10px; white-space: nowrap; }
  a.dl:active { background: rgba(56,189,248,0.1); }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="dot" id="dot"></span>
      <h1 id="title">Kuri</h1>
    </div>
    <span class="badge" id="connBadge">Connected</span>
  </header>
  <p class="sub" id="subtitle"></p>

  <section class="card">
    <h2 id="uploadTitle"></h2>
    <label class="filelabel" for="fileInput" id="chooseFile"></label>
    <input type="file" id="fileInput" multiple />
    <div class="progress" id="upProgress"><i id="upBar"></i></div>
    <div class="status" id="upStatus"></div>
    <div class="hint" id="maxFileHint"></div>
  </section>

  <section class="card">
    <h2 id="textTitle"></h2>
    <textarea id="textInput" maxlength="65536" placeholder=""></textarea>
    <div class="row" style="margin-top:10px">
      <button class="primary grow" id="sendText"></button>
    </div>
    <div class="status" id="textStatus"></div>
    <div class="hint" id="maxTextHint"></div>
  </section>

  <section class="card">
    <h2 id="filesTitle"></h2>
    <ul id="fileList"></ul>
    <div class="status" id="listStatus"></div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var T = __STRINGS__;
  var MAX_FILE = "__MAX_FILE__";
  var MAX_TEXT = Number("__MAX_TEXT__");
  var base = window.location.pathname.replace(/\/+$/, "") + "/";

  function el(id) { return document.getElementById(id); }
  function txt(id, value) { var node = el(id); if (node) node.textContent = value; }

  document.title = T.title;
  txt("title", T.title);
  txt("subtitle", T.subtitle);
  txt("uploadTitle", T.uploadTitle);
  txt("chooseFile", T.chooseFile);
  txt("textTitle", T.textTitle);
  txt("sendText", T.sendText);
  txt("filesTitle", T.filesTitle);
  txt("maxFileHint", T.maxFileSize.replace("{0}", MAX_FILE));
  txt("maxTextHint", T.maxTextSize.replace("{0}", String(MAX_TEXT)));
  el("textInput").placeholder = T.textPlaceholder;

  function setConnected(ok) {
    var dot = el("dot");
    var badge = el("connBadge");
    dot.className = "dot" + (ok ? "" : " offline");
    badge.textContent = ok ? T.connected : T.offline;
  }

  function setStatus(id, message, kind) {
    var node = el(id);
    node.textContent = message || "";
    node.className = "status" + (kind ? " " + kind : "");
  }

  function formatSize(bytes) {
    if (!bytes && bytes !== 0) return "";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
  }

  var listBusy = false;

  function refreshList() {
    if (listBusy || document.hidden) return;
    listBusy = true;

    fetch(base + "list", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        setConnected(true);
        renderList(data.files || []);
        setStatus("listStatus", "");
      })
      .catch(function () {
        setConnected(false);
        setStatus("listStatus", T.offline, "bad");
      })
      .then(function () {
        listBusy = false;
      });
  }

  function renderList(files) {
    var list = el("fileList");
    list.innerHTML = "";

    if (!files.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = T.noFiles;
      list.appendChild(empty);
      return;
    }

    files.forEach(function (file) {
      var li = document.createElement("li");

      var name = document.createElement("span");
      name.className = "fname";
      name.textContent = file.name;
      name.title = file.name;

      var size = document.createElement("span");
      size.className = "fsize";
      size.textContent = formatSize(file.size);

      var link = document.createElement("a");
      link.className = "dl";
      link.href = base + "file/" + encodeURIComponent(file.id);
      link.setAttribute("download", file.name);
      link.textContent = T.download;

      li.appendChild(name);
      li.appendChild(size);
      li.appendChild(link);
      list.appendChild(li);
    });
  }

  function setProgress(percent) {
    var box = el("upProgress");
    var bar = el("upBar");
    if (percent === null) {
      box.className = "progress";
      bar.style.width = "0%";
      return;
    }
    box.className = "progress on";
    bar.style.width = Math.max(0, Math.min(100, percent)) + "%";
  }

  function uploadNext(files, index) {
    if (index >= files.length) {
      setProgress(null);
      setStatus("upStatus", T.uploaded, "ok");
      el("fileInput").value = "";
      refreshList();
      return;
    }

    var file = files[index];

    if (file.size > 2147483648) {
      setStatus("upStatus", T.tooLarge, "bad");
      uploadNext(files, index + 1);
      return;
    }

    setStatus("upStatus", T.uploading + " " + file.name, "");
    setProgress(0);

    var xhr = new XMLHttpRequest();
    xhr.open("PUT", base + "upload?name=" + encodeURIComponent(file.name), true);
    xhr.setRequestHeader("Content-Type", "application/octet-stream");

    xhr.upload.onprogress = function (event) {
      if (event.lengthComputable && event.total > 0) {
        setProgress((event.loaded / event.total) * 100);
      }
    };

    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) {
        setProgress(100);
        uploadNext(files, index + 1);
      } else {
        var message = xhr.status === 413 ? T.tooLarge : T.uploadFailed;
        setStatus("upStatus", message, "bad");
        setProgress(null);
      }
    };

    xhr.onerror = function () {
      setStatus("upStatus", T.uploadFailed, "bad");
      setProgress(null);
      setConnected(false);
    };

    xhr.send(file);
  }

  el("fileInput").addEventListener("change", function (event) {
    var files = Array.prototype.slice.call(event.target.files || []);
    if (!files.length) return;
    uploadNext(files, 0);
  });

  el("sendText").addEventListener("click", function () {
    var input = el("textInput");
    var value = input.value;

    if (!value.trim()) {
      setStatus("textStatus", T.emptyText, "bad");
      return;
    }

    var size = new TextEncoder().encode(value).length;
    if (size > MAX_TEXT) {
      setStatus("textStatus", T.textTooLong, "bad");
      return;
    }

    var button = el("sendText");
    button.disabled = true;

    fetch(base + "text", {
      method: "POST",
      headers: { "Content-Type": "text/plain; charset=utf-8" },
      body: value
    })
      .then(function (res) {
        if (res.status === 413) throw new Error("too-long");
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function () {
        setStatus("textStatus", T.sent, "ok");
        input.value = "";
        setConnected(true);
      })
      .catch(function (err) {
        setStatus("textStatus", err && err.message === "too-long" ? T.textTooLong : T.uploadFailed, "bad");
        setConnected(false);
      })
      .then(function () {
        button.disabled = false;
      });
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) refreshList();
  });

  refreshList();
  setInterval(refreshList, 8000);
})();
</script>
</body>
</html>
